# openapi: 3.0.3
# info:
#   title: AgroLand Integration Platform API
#   description: |
#     # Интеграционная платформа для агро-земельного маркетплейса
    
#     О проекте
#     Проект разработан в рамках курсовой работы по теме "Разработка интеграционного решения для взаимодействия информационных систем".
    
#     Основные интеграции
#     1. Росреестр API - проверка кадастровых данных, запрос выписок ЕГРН
#     2. OpenStreetMap Nominatim API - геокодирование, поиск инфраструктуры
#     3. Внутренняя аналитическая система - анализ земельных участков
    
#     Система аутентификации
#     Публичные API - без аутентификации
#     Защищенные API - требуют API ключ в заголовке `X-API-Key`
#     Пользовательские API - требуют JWT токен
    
#     Архитектура решения
#     Клиент → API Gateway → [Валидация → Rate Limiting → Маршрутизация] → Сервисы → Адаптеры → Внешние API
    
#     Быстрый старт
#     1. Зарегистрируйтесь: `POST /supplier/register`
#     2. Получите API ключ: `POST /api/user/api-keys`
#     3. Используйте API ключ в заголовках: `X-API-Key: ваш_ключ`
    
#   version: 1.0.0
#   contact:
#     name: AgroLand Development Team
#     email: api-support@agroland.ru
#   license:
#     name: MIT
#     url: https://opensource.org/licenses/MIT

# servers:
#   - url: http://localhost:5000/api
#     description: Локальный сервер разработки
#   - url: https://api.agroland.ru/v1
#     description: Продакшн сервер

# tags:
#   - name: Аутентификация
#     description: Регистрация, вход, управление API ключами
#   - name: Поставщики
#     description: Управление поставщиками (фермерами)
#   - name: Участки
#     description: Управление земельными участками
#   - name: Геокодирование
#     description: Интеграция с OpenStreetMap (OSM)
#   - name: Росреестр
#     description: Интеграция с API Росреестра
#   - name: Аналитика
#     description: Анализ земельных участков
#   - name: Публичный доступ
#     description: API без аутентификации

