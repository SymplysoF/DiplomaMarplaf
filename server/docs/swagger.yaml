openapi: 3.0.3
info:
  title: Agro Platform API
  version: 1.0.0
  description: |
    Внутренний и публичный API агро-платформы.
    Основан на PostgreSQL (users, suppliers, places, products и др.).

servers:
  - url: http://localhost:5000
    description: Local development

tags:
  - name: Auth
    description: Аутентификация и пользователи
  - name: Public
    description: Публичные каталоги (чтение без авторизации)
  - name: Supplier
    description: Операции для поставщика
  - name: Admin
    description: Операции администратора
  - name: System
    description: Служебные маршруты

paths:
  # ---------- PUBLIC (READ-ONLY) ----------

  /api/public/suppliers:
    get:
      tags: [Public]
      summary: Список поставщиков
      description: Публичный список поставщиков на основе таблиц suppliers и suppliercopies.
      responses:
        '200':
          description: Список поставщиков
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  suppliers:
                    type: array
                    items:
                      $ref: '#/components/schemas/PublicSupplier'

  /api/public/products:
    get:
      tags: [Public]
      summary: Список продуктов
      description: Публичный список продуктов на основе таблиц products и productcopies.
      responses:
        '200':
          description: Список продуктов
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  products:
                    type: array
                    items:
                      $ref: '#/components/schemas/PublicProduct'

  /api/public/places:
    get:
      tags: [Public]
      summary: Список участков
      description: Публичный список участков на основе таблицы places (без привязки к конкретным пользователям).
      responses:
        '200':
          description: Список участков
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  places:
                    type: array
                    items:
                      $ref: '#/components/schemas/PublicPlace'

  # ---------- AUTH ----------

  /api/supplier/register:
    post:
      tags: [Auth]
      summary: Регистрация поставщика
      description: |
        Создает пользователя с ролью "Поставщик" (roleId = 2) через функцию createUserWithRoleSupplier
        и возвращает JWT-токен.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupplierRegistration'
      responses:
        '201':
          description: Поставщик успешно зарегистрирован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationResponse'
        '400':
          description: Ошибка валидации или уникальности
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/users/create:
    post:
      tags: [Auth]
      summary: Создание пользователя (тестовый)
      description: Создает пользователя в таблице users. Используется для тестирования.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: Пользователь создан
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  user:
                    $ref: '#/components/schemas/UserInfo'
        '400':
          description: Ошибка создания пользователя
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /login:
    post:
      tags: [Auth]
      summary: Логин пользователя
      description: |
        Аутентификация по username и паролю.
        Возвращает JWT, содержащий userId и roleId.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [login, password]
              properties:
                login:
                  type: string
                  example: "supplier123"
                password:
                  type: string
                  format: password
                  example: "SecurePass123!"
      responses:
        '200':
          description: Вход успешен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Неверный логин или пароль
        '500':
          description: Внутренняя ошибка сервера

  /api/user/profile:
    get:
      tags: [Auth]
      summary: Профиль аутентифицированного пользователя
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Профиль текущего пользователя из JWT
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  user:
                    $ref: '#/components/schemas/JwtUser'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  # ---------- SUPPLIER ROUTES ----------

  /api/supplier/profile:
    get:
      tags: [Supplier]
      summary: Получить профиль поставщика
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Профиль поставщика
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  supplier:
                    $ref: '#/components/schemas/SupplierProfileRaw'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          description: Профиль поставщика не найден

    put:
      tags: [Supplier]
      summary: Обновить профиль поставщика
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                rating:
                  type: number
                  format: float
      responses:
        '200':
          description: Профиль обновлен
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  supplier:
                    $ref: '#/components/schemas/SupplierProfileRaw'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /api/supplier/places:
    get:
      tags: [Supplier]
      summary: Получить участки поставщика
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Список участков текущего поставщика
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  places:
                    type: array
                    items:
                      $ref: '#/components/schemas/SupplierPlace'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

    post:
      tags: [Supplier]
      summary: Добавить участок поставщику
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddPlaceRequest'
      responses:
        '201':
          description: Участок успешно добавлен
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  placeId:
                    type: integer
        '400':
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /api/supplier/places/{placeId}:
    delete:
      tags: [Supplier]
      summary: Удалить участок из профиля поставщика
      security:
        - BearerAuth: []
      parameters:
        - name: placeId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Участок удален
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          description: Участок не найден или не принадлежит поставщику

  /api/check-cadastr:
    post:
      tags: [Supplier]
      summary: Проверка кадастрового номера (мок)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kadastrNumber]
              properties:
                kadastrNumber:
                  type: string
                  example: "77:01:0001001:123"
      responses:
        '200':
          description: Результат проверки (реальный или мок)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                  isMock:
                    type: boolean
        '400':
          description: Неверный формат кадастрового номера
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  # ---------- ADMIN ROUTES ----------

  /api/admin/suppliers:
    get:
      tags: [Admin]
      summary: Получить список поставщиков (админ)
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: search
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Список поставщиков с пагинацией
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  suppliers:
                    type: array
                    items:
                      $ref: '#/components/schemas/AdminSupplier'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

    post:
      tags: [Admin]
      summary: Создать поставщика (админ)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupplierRegistration'
      responses:
        '201':
          description: Поставщик создан
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /api/admin/suppliers/{id}:
    put:
      tags: [Admin]
      summary: Обновить поставщика
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                rating:
                  type: number
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: Данные поставщика обновлены
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          description: Поставщик не найден

  /api/admin/suppliers/{id}/toggle-status:
    post:
      tags: [Admin]
      summary: Блокировка/разблокировка поставщика
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                isActive:
                  type: boolean
      responses:
        '200':
          description: Статус поставщика изменен
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          description: Поставщик не найден

  # ---------- SYSTEM ----------

  /health:
    get:
      tags: [System]
      summary: Health check
      responses:
        '200':
          description: Состояние сервера
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  timestamp:
                    type: string
                    format: date-time

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    UnauthorizedError:
      description: Неавторизованный доступ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Error:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string

    Pagination:
      type: object
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        pages:
          type: integer

    UserInfo:
      type: object
      properties:
        userId:
          type: integer
        roleId:
          type: integer
        role:
          type: string
        username:
          type: string
        email:
          type: string
          format: email

    JwtUser:
      type: object
      properties:
        userId:
          type: integer
        roleId:
          type: integer
        role:
          type: string
        username:
          type: string

    SupplierRegistration:
      type: object
      required: [name, username, email, password]
      properties:
        name:
          type: string
        description:
          type: string
        username:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    RegistrationResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        userId:
          type: integer
        token:
          type: string
        user:
          $ref: '#/components/schemas/UserInfo'

    CreateUserRequest:
      type: object
      required: [username, email, password, roleId]
      properties:
        username:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          format: password
        roleId:
          type: integer

    LoginResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        token:
          type: string
        user:
          $ref: '#/components/schemas/UserInfo'

    PublicSupplier:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        rating:
          type: number
          format: float
        description:
          type: string

    PublicProduct:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
        price:
          type: number
        unit:
          type: string

    PublicPlace:
      type: object
      properties:
        id:
          type: integer
        address:
          type: string
        kadastrnumber:
          type: string
        area:
          type: number

    SupplierProfileRaw:
      type: object
      description: Прямая проекция JOIN suppliers + suppliercopies.
      properties:
        id:
          type: integer
        name:
          type: string
        userid:
          type: integer
        rating:
          type: number
        description:
          type: string

    SupplierPlace:
      type: object
      properties:
        id:
          type: integer
        address:
          type: string
        kadastrnumber:
          type: string
        area:
          type: number
        boundaries:
          type: object
          description: GeoJSON (из ST_AsGeoJSON)

    AddPlaceRequest:
      type: object
      required: [address, kadastrNumber, area, boundaries]
      properties:
        address:
          type: string
        kadastrNumber:
          type: string
          example: "50:15:0123456:789"
        area:
          type: number
        boundaries:
          type: object
          description: GeoJSON polygon

    AdminSupplier:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        userid:
          type: integer
        username:
          type: string
        email:
          type: string
        rating:
          type: number
        description:
          type: string
        places_count:
          type: integer
